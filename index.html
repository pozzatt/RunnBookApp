function openBook(){openR(bookDoc())}
function bookLbl(){const d=S.docs.find(x=>x.id==='tsc');return d&&d.pos>0&&!d.done?'Continuar':'Ler grátis'}
function heroHTML(){const d=S.docs.find(x=>x.id==='tsc'),p=d?(d.done?100:Math.round(d.pos/d.n*100)):0;return `<div class="hero"><div class="bkc"></div><div class="hi2"><span class="tag">Livro grátis</span><h3>${BOOK.title}</h3><p class="mu s">${BOOK.sub}</p><p class="s" style="margin:4px 0 12px">${BOOK.by}</p>${p?`<div class="bar"><i style="width:${p}%"></i></div>`:''}<button class="pill" data-a="book">${bookLbl()}</button></div></div>`}

/* leitor */
const R={d:null,w:[],i:0,play:false,t:null,se:-1,fresh:true},PL='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PA='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const IMP='<svg viewBox="0 0 24 24"><path d="M12 3v11M8 10l4 4 4-4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>',SMP='<svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h12M4 16h16M4 21h9"/></svg>';
function panel(){const d=R.d;$('#pn').innerHTML=d?`<div class="cd"><div class="ti"><b>${esc(d.title)}</b><span id="rm"></span></div><input type="range" id="sc" min="0" max="${R.w.length-1}" value="${R.i}"><div class="row"><button class="sk" data-k="b1"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button><button id="pl" data-k="pl">${PL}</button><button class="sk" data-k="f1"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button></div><div class="row" style="gap:14px"><button class="gl" data-k="wm">−</button><b id="wl" style="min-width:90px;text-align:center"></b><button class="gl" data-k="wp">+</button></div><div class="ti" style="justify-content:center">Arraste a palavra:<span style="display:inline-flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>palavras</span><span>·</span><span style="display:inline-flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4"/></svg>frases</span></div></div>`:`<div class="cd id"><button class="bkrow" data-k="book"><div class="bkc"></div><div class="bki"><span class="tag">Livro grátis</span><b>Tudo Sobre Corrida</b><small>Agair Gil e Bruno Pozzatt</small></div><span class="pill">${bookLbl()}</span></button><button class="bt s" data-k="imp">${IMP}<span>Importar para ler</span></button><button class="bt s o" data-k="smp">${SMP}<span>Experimentar amostra</span></button></div>`}
$('#pn').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k==='imp')openAdd();else if(k==='smp')sample();else if(k==='book')openBook();else if(k==='pl')R.play?pause():play();else if(k==='b1'){let j=R.i-1;while(j>0&&!END.test(R.w[j-1]))j--;seek(j)}else if(k==='f1'){let j=R.i;while(j<R.w.length-1&&!END.test(R.w[j]))j++;seek(j+1)}else if(k==='wm')wpm(S.set.wpm-25);else if(k==='wp')wpm(S.set.wpm+25)};
$('#pn').oninput=e=>{if(e.target.id==='sc')seek(+e.target.value)};

function paint(w,el){const l=w.length,o=l<2?0:l<6?1:l<10?2:l<14?3:4;(el||$('#wd')).innerHTML=`<span class="a">${esc(w.slice(0,o))}</span><span class="o">${esc(w[o]||'')}</span><span class="b">${esc(w.slice(o+1))}</span>`}
function show(){if(!R.d){idleStart();return}const n=R.w.length;paint(R.w[R.i]);const sc=$('#sc');if(sc)sc.value=R.i;tx('#wl',S.set.wpm+' ppm');tx('#rm',Math.round(R.i/n*100)+'% · '+Math.max(1,Math.round((n-R.i)/S.set.wpm))+' min restantes');R.d.pos=R.i}
function openR(d){R.d=d;R.w=d.text.split(' ');if(d.done){d.pos=0;d.done=false}R.i=Math.min(d.pos,R.w.length-1);S.cur=d.id;go('ler');flush()}
function sample(){let d=S.docs.find(x=>x.sample);if(!d){d=addDoc('Amostra: leitura dinâmica',SAMPLE);d.sample=true}openR(d)}
function speakFrom(i){if(!window.speechSynthesis)return;let j=i;while(j<R.w.length-1&&!END.test(R.w[j]))j++;R.se=j;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(R.w.slice(i,j+1).join(' '));u.lang='pt-BR';u.rate=Math.min(2,Math.max(.6,S.set.wpm/170));speechSynthesis.speak(u)}
function tick(){if(!R.play)return;show();const w=R.w[R.i];if(S.set.spoken&&(R.fresh||R.i>R.se)){speakFrom(R.i);R.fresh=false}
let d=60000/S.set.wpm;if(w.length>8)d*=1.3;if(S.set.pause){if(END.test(w))d*=2.2;else if(MID.test(w))d*=1.5}
const s=S.stats,k=new Date().toLocaleDateString('sv');s.words++;s.secs+=d/1000;s.days[k]=(s.days[k]||0)+1;if(s.words%25===0)save();
R.t=setTimeout(()=>{if(R.i>=R.w.length-1){R.d.done=true;pause();paint('Concluído');return}R.i++;tick()},d)}
function play(){if(R.i>=R.w.length-1)R.i=0;R.play=true;R.fresh=true;$('#rv').classList.add('pl');const p=$('#pl');if(p)p.innerHTML=PA;tick()}
function pause(){R.play=false;clearTimeout(R.t);if(window.speechSynthesis)speechSynthesis.cancel();$('#rv').classList.remove('pl');const p=$('#pl');if(p)p.innerHTML=PL;flush()}
const seek=i=>{if(!R.d)return;R.i=Math.max(0,Math.min(R.w.length-1,i));R.fresh=true;show();if(R.play){clearTimeout(R.t);tick()}},wpm=v=>{S.set.wpm=Math.max(100,Math.min(1000,v));tx('#wl',S.set.wpm+' ppm');save()};
$('#cb').onclick=()=>{if(!R.d)return sheet('<b style="font-size:20px">Como usar</b><p>Toque em <b>Importar para ler</b> e cole um texto ou escolha um arquivo. Toque na palavra para pausar ou continuar. Use as setas para voltar ou avançar uma frase e o contexto para rever o trecho ao redor.</p>');pause();const a=Math.max(0,R.i-80),b=Math.min(R.w.length,R.i+140);sheet('<div class="hd"><b style="font-size:20px">Contexto</b><button class="pill g" data-a="close">Fechar</button></div><p class="cx">'+R.w.slice(a,b).map((w,k)=>`<span data-j="${a+k}"${a+k===R.i?' class="cur"':''}>${esc(w)}</span>`).join(' ')+'</p><p class="mu s">Toque em uma palavra para continuar dali.</p>')};
$('#sb').onclick=async()=>{const u=location.href;try{if(navigator.share)await navigator.share({title:'RunnBook',url:u});else await navigator.clipboard.writeText(u)}catch(e){}};
/* apresentação */
let OS=0,OT;
const OB=[
`<div class="ob-b" style="gap:34px"><div><div class="lg" role="img" aria-label="RunnBook"></div><p class="ob-t">Leia na velocidade do seu pensamento.</p></div><div class="oz"><div class="wdx" id="od"></div></div><p class="mu" style="padding:0 10px">Runn de running, Book de livro: o leitor que faz a sua leitura correr.</p></div>`,
`<div class="ob-b" style="justify-content:flex-start"><h2>Por que ler rápido?</h2><div class="oc"><em><svg viewBox="0 0 24 24" width="15" height="15" style="stroke:#fff;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></em><div><b>Foco total</b><span>Com uma palavra de cada vez na tela, sobra pouco espaço para a mente divagar.</span></div></div><div class="oc"><em><svg viewBox="0 0 24 24" width="15" height="15" style="stroke:#fff;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></em><div><b>Sem voltar o olho</b><span>Seu olhar fica parado e o texto vem até você, com ritmo constante e menos releituras sem querer.</span></div></div><div class="oc"><em><svg viewBox="0 0 24 24" width="15" height="15" style="stroke:#fff;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></em><div><b>Mais leitura em menos tempo</b><span>Aumente a velocidade aos poucos e leia mais no mesmo tempo.</span></div></div><div class="oc"><em><svg viewBox="0 0 24 24" width="15" height="15" style="stroke:#fff;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></em><div><b>Fácil de começar</b><span>Sessões curtas, sem folhear páginas, ajudam a criar o hábito de ler todos os dias.</span></div></div><p class="mu s">A compreensão varia de pessoa para pessoa. Comece devagar e só acelere quando estiver confortável.</p></div>`,
`<div class="ob-b" style="justify-content:flex-start"><h2>Como funciona</h2><div class="oc"><em>1</em><div><b>Importe seu texto</b><span>Cole um texto ou escolha um arquivo PDF, EPUB, TXT ou Markdown.</span></div></div><div class="oc"><em>2</em><div><b>Fixe o olhar na letra vermelha</b><span>Ela marca o ponto de foco de cada palavra. Comece em 300 palavras por minuto.</span></div></div><div class="oc"><em>3</em><div><b>Controle do seu jeito</b><span>Toque na palavra para pausar, volte uma frase, veja o contexto e ajuste a velocidade quando quiser.</span></div></div><div class="oc"><em>4</em><div><b>Resuma e acompanhe</b><span>Gere um resumo dos pontos principais e veja suas estatísticas nos Ajustes.</span></div></div></div>`];
function obR(){clearInterval(OT);$('#ob').innerHTML=(OS?'<button class="ob-s" data-o="done">Pular</button>':'<div style="height:44px"></div>')+OB[OS]+`<div class="dots">${OB.map((_,i)=>'<i'+(i===OS?' class="on"':'')+'></i>').join('')}</div><button class="big" data-o="next">${['Toque para iniciar','Continuar','Começar a ler'][OS]}</button><div class="ob-f">PozzattClub Estúdios</div>`;
if(!OS){const W=['RunnBook','Leia','uma','palavra','de','cada','vez,','sem','esforço.'];let k=0;const f=()=>paint(W[k++%W.length],$('#od'));f();OT=setInterval(f,520)}}
function showOb(){OS=0;$('#ob').hidden=false;obR()}
function hideOb(){clearInterval(OT);$('#ob').hidden=true;if(!S.seen){S.seen=true;flush()}go('ler')}
$('#ob').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;if(b.dataset.o==='done'||OS>=OB.length-1)return hideOb();OS++;obR()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)R.play?pause():flush()});
(async()=>{const l=await load();if(l){S=Object.assign(DEF(),l);S.set=Object.assign(DEF().set,l.set);if(!l.set||!l.set.v3){S.set.font='slab';S.set.v3=1}}theme();const d=S.docs.find(x=>x.id===S.cur);if(d){R.d=d;R.w=d.text.split(' ');R.i=Math.min(d.pos,R.w.length-1)}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}go('ler');if(!S.seen)showOb();requestAnimationFrame(()=>{$('#bt').classList.add('off');setTimeout(()=>{const b=$('#bt');if(b)b.remove()},400)})})();
</script></body></html>
