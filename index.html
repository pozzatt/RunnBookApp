<style>

:root[data-theme="warm"]{--bg:#efe3c8;--card:rgba(251,245,230,.92);--sheet:#fbf5e6;--fg:#3b2f1e;--mu:#9a8660;--sep:rgba(120,90,40,.22);--fill:rgba(120,90,40,.14);--ac:#3b2f1e;--onac:#fbf5e6;--hi:#c2410c;--wd:#5a4930;--glass:rgba(239,227,200,.75)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .12s,opacity .12s}button:active{transform:scale(.96);opacity:.7}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.mu{color:var(--mu)}.s{font-size:14px}
.grp{background:var(--card);border-radius:22px;overflow:hidden}
.rw{display:flex;gap:14px;align-items:center;padding:14px;border-bottom:.5px solid var(--sep)}.rw:last-child{border:0}
.cv{width:54px;height:76px;flex:none;border-radius:6px 10px 10px 6px;background:linear-gradient(150deg,hsl(var(--h) 38% 56%),hsl(calc(var(--h) + 30) 40% 36%));color:#fff;font:700 26px/76px "Zilla Slab",serif;text-align:center;box-shadow:inset 3px 0 0 rgba(255,255,255,.22),0 6px 14px rgba(0,0,0,.2)}
.in{flex:1;min-width:0}.in b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--fill);border-radius:2px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.lk{display:flex;gap:16px;font-size:14px;color:var(--mu)}
.pill{background:var(--ac);color:var(--onac);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}.pill.g{background:var(--fill);color:var(--fg)}
.big{display:block;width:100%;padding:15px;border-radius:999px;font-weight:600;font-size:17px;text-align:center;margin:10px 0;background:var(--ac);color:var(--onac);box-sizing:border-box}.big.g{background:var(--fill);color:var(--fg)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:2px;margin-bottom:6px}.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:500}.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--fg);background:var(--card);border:0;border-radius:16px;padding:14px;margin:0 0 10px;outline:none}
textarea{min-height:190px;resize:vertical}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h1{margin:18px 0 14px}
.emp{text-align:center;padding:60px 20px;color:var(--mu)}
.tile{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile div{background:var(--card);border-radius:22px;padding:16px}.tile b{display:block;font-size:30px;font-weight:700;letter-spacing:-.5px}
.ch{display:flex;align-items:flex-end;gap:8px;height:110px;padding:16px}.ch div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:11px;color:var(--mu)}.ch i{width:100%;background:var(--ac);border-radius:6px;min-height:3px}
ol{margin:0;padding:14px 14px 14px 36px}li{margin:8px 0}
.rw2{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:.5px solid var(--sep)}.rw2:last-child{border:0}
.sw{position:relative;width:51px;height:31px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}.sw i{position:absolute;inset:0;background:var(--fill);border-radius:16px;transition:.2s}.sw i:after{content:"";position:absolute;width:27px;height:27px;top:2px;left:2px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}.sw input:checked+i{background:#34c759}.sw input:checked+i:after{transform:translateX(20px)}
.stp{display:flex;align-items:center;gap:12px}.stp b{min-width:76px;text-align:center}.gl{width:40px;height:40px;border-radius:50%;background:var(--fill);font-size:22px;display:inline-flex;align-items:center;justify-content:center}
nav{position:fixed;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:4px;padding:8px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border:1px solid var(--sep);border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:30px;font-size:13px;font-weight:600}nav button.on{background:var(--fill)}nav svg{width:28px;height:28px}
#rv{position:fixed;inset:0}
.tb{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:10px 16px;transition:opacity .3s}
.gc{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--sep);box-shadow:0 6px 18px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}.gc svg{width:26px;height:26px}
.sp{display:none}

.ft{display:flex;justify-content:space-between;border-top:1px solid var(--sep);padding-top:14px;color:var(--mu);font:15px ui-monospace,"SF Mono",Menlo,monospace}

.ob-t{font-size:20px;margin:8px 0 0}.ob-b p{margin:0}

.oc{background:var(--card);border-radius:22px;padding:14px 16px;text-align:left;display:flex;gap:14px;align-items:flex-start}.oc b{display:block;font-weight:600;margin-bottom:2px}.oc span{color:var(--mu);font-size:15px;line-height:1.35}
.oc em{font-style:normal;width:28px;height:28px;flex:none;border-radius:50%;background:var(--hi);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:2px}
.ob-s{align-self:flex-end;color:var(--mu);font-size:15px;padding:12px 4px}
.dots{display:flex;justify-content:center;gap:7px;margin:6px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--fill)}.dots i.on{background:var(--fg)}

#ob{--bg:#f4f4f7;--card:#fff;--fg:#1c1c1e;--mu:#8e8e93;--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.16);--ac:#1c1c1e;--onac:#fff;--hi:#e5393c;--wd:#4b4b4f}
.ob-t{color:var(--mu);font-size:19px;margin:18px 0 0}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
#ob .lg{animation:up .8s ease both}#ob .ob-t{animation:up .8s .15s ease both}#ob .oz{animation:up .8s .35s ease both}
:root[data-theme="white"]{--bg:#fff;--card:#f4f4f6;--sheet:#fff;--fg:#000;--mu:#8a8a8e;--sep:rgba(0,0,0,.14);--fill:rgba(120,120,128,.14);--ac:#000;--onac:#fff;--hi:#e5393c;--wd:#000;--glass:rgba(255,255,255,.8)}
:root[data-f="slab"] #wd,:root[data-f="slab"] .pvw{font-family:"Zilla Slab","American Typewriter",Rockwell,ui-serif,serif}
:root[data-f="sans"] #wd,:root[data-f="sans"] .pvw{font-family:-apple-system,"SF Pro Display",system-ui,Roboto,sans-serif}
:root[data-f="serif"] #wd,:root[data-f="serif"] .pvw{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif}
:root[data-f="mono"] #wd,:root[data-f="mono"] .pvw{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[data-s="font:slab"]{font-family:"Zilla Slab",serif!important}[data-s="font:sans"]{font-family:-apple-system,system-ui,sans-serif!important}[data-s="font:serif"]{font-family:ui-serif,Georgia,serif!important}[data-s="font:mono"]{font-family:ui-monospace,Menlo,monospace!important}
.pv{position:relative;height:100px;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);display:flex;align-items:center}
.pvw{width:82%;display:grid;grid-template-columns:1fr auto 1fr;font:500 42px/1 "Zilla Slab",serif;color:var(--wd);white-space:nowrap}.pvw .a{text-align:right}.pvw .b{text-align:left}.pvw .o{color:var(--hi)}
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.sw2{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mu)}.sw2 i{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sep)}.sw2.on{color:var(--fg);font-weight:600}.sw2.on i{outline:2.5px solid var(--fg);outline-offset:2px}
